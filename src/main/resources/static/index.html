<!DOCTYPE html>
<html>
<head>
    <title>Webhook Relay & Retry Service</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        section { margin-bottom: 40px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 16px; cursor: pointer; }
        .result { margin-top: 15px; padding: 10px; background: #f4f4f4; word-break: break-all; }
    </style>
</head>
<body>
<h1>Webhook Relay & Retry Service</h1>

<section>
    <h2>Create a Receiver</h2>
    <form id="createForm">
        <input type="text" id="name" placeholder="Receiver name" required>
        <input type="text" id="destinationURL" placeholder="Destination URL" required>
        <button type="submit">Create</button>
    </form>
    <div id="createResult" class="result" style="display:none;"></div>
</section>

<section>
    <h2>View a Receiver</h2>
    <form id="viewForm">
        <input type="text" id="token" placeholder="Management token" required>
        <button type="submit">View</button>
    </form>
    <div id="viewResult" class="result" style="display:none;"></div>
</section>

<section id="managePanel" style="display:none;">
    <h2 id="receiverName"></h2>

    <p><strong>Destination URL:</strong> <span id="destUrl"></span></p>
    <p><strong>Webhook URL:</strong> <span id="webhookUrlDisplay"></span></p>
    <p><strong>Secret Key:</strong> <span id="secretKeyDisplay"></span></p>

    <label>
        <input type="checkbox" id="chaosToggle"> Chaos Mode (simulate failures)
    </label>
    <br>
    <label>
        Max Retries:
        <input type="number" id="maxRetriesInput" min="1" max="10" style="width:60px;">
    </label>
    <button id="saveSettings">Save Settings</button>

    <h3>Event History</h3>
    <div id="eventsList"></div>
</section>

<script>
    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const destinationURL = document.getElementById('destinationURL').value;

        const response = await fetch('/receivers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, destinationURL: destinationURL })
        });

        const data = await response.json();

        const resultDiv = document.getElementById('createResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
        <p><strong>Webhook URL (give to sender):</strong><br>${data.webhookUrl}</p>
        <p><strong>Management URL (save this!):</strong><br>${data.managementUrl}</p>
      `;
    });

    let currentToken = null;

    document.getElementById('viewForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const token = document.getElementById('token').value;
        currentToken = token;

        const response = await fetch('/manage/' + token);
        if (!response.ok) {
            document.getElementById('managePanel').style.display = 'none';
            document.getElementById('viewResult').style.display = 'block';
            document.getElementById('viewResult').innerHTML = '<p>No receiver found for that token.</p>';
            return;
        }

        document.getElementById('viewResult').style.display = 'none';

        const data = await response.json();
        renderManagePanel(data);
        loadEvents(token);
    });

    function renderManagePanel(data) {
        document.getElementById('managePanel').style.display = 'block';
        document.getElementById('receiverName').innerText = data.name;
        document.getElementById('destUrl').innerText = data.destinationUrl;
        document.getElementById('webhookUrlDisplay').innerText = data.webhookUrl;
        document.getElementById('secretKeyDisplay').innerText = data.secretKey;
        document.getElementById('chaosToggle').checked = data.chaosMode;
        document.getElementById('maxRetriesInput').value = data.maxRetries;
    }

    document.getElementById('saveSettings').addEventListener('click', async function() {
        const body = {
            chaosMode: document.getElementById('chaosToggle').checked,
            maxRetries: parseInt(document.getElementById('maxRetriesInput').value)
        };

        const response = await fetch('/manage/' + currentToken, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!response.ok) {
            const errorText = await response.text();
            alert('Error: ' + errorText);
            return;
        }

        const data = await response.json();
        renderManagePanel(data);
        alert('Settings saved!');
    });

    async function loadEvents(token) {
        const response = await fetch('/manage/' + token + '/events');
        const events = await response.json();

        const eventsListDiv = document.getElementById('eventsList');
        eventsListDiv.innerHTML = '';

        for (const event of events) {
            const eventDiv = document.createElement('div');
            eventDiv.style.border = '1px solid #ddd';
            eventDiv.style.padding = '10px';
            eventDiv.style.marginBottom = '10px';

            let attemptsHtml = '';
            for (const attempt of event.attempts) {
                const resultText = attempt.success ? 'SUCCESS' : 'FAILED';
                attemptsHtml += `<li>Attempt ${attempt.attemptNumber} — ${attempt.attemptedAt} — ${resultText}` +
                    (attempt.statusCode ? ` (status ${attempt.statusCode})` : '') +
                    (attempt.errorMessage ? ` — ${attempt.errorMessage}` : '') +
                    `</li>`;
            }

            eventDiv.innerHTML = `
      <p><strong>Event #${event.eventId}</strong> — ${event.status} — ${event.attemptCount} attempt(s)</p>
      <ul>${attemptsHtml}</ul>
    `;
            eventsListDiv.appendChild(eventDiv);
        }
    }
</script>
</body>
</html>
