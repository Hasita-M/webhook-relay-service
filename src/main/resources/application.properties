spring.application.name=WebRelayRetryService
server.port=${PORT:8080}
receiver-api.base-url=http://localhost:${server.port}/receiver
receiver-api.path=/receiver
webhook-api.base-url=http://localhost:${server.port}/webhook
webhook-api.path=/webhook
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webhook_relay}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true