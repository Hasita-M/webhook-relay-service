spring.application.name=WebRelayRetryService
server.port=${PORT:8080}

receiver-api.base-url=http://localhost:${server.port}
receiver-api.path=/receiver

webhook-api.base-url=http://localhost:${server.port}/webhook
webhook-api.path=/webhook

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhook_relay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

spring.data.redis.timeout=5000
spring.data.redis.connect-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true